<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lecture Notes — Physics with HPG</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script id="MathJax-script" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js"></script>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="lecture-notes.html" class="active">Lecture Notes</a>
  <a href="assignments.html">Assignment</a>
  <a href="ebooks.html">E-Book</a>
  <a href="previous-papers.html">Previous Year Question Papers</a>
</nav>

<div class="banner"><h1>Lecture Notes</h1></div>

<div class="content">
<button class="print-btn" onclick="window.print()">Export this page to PDF</button>
<div id="markdown-content">Loading notes...</div>
</div>

<script>
fetch('lecture-notes-content.md')
  .then(res => res.text())
  .then(md => {
    document.getElementById('markdown-content').innerHTML = marked.parse(md);
    if (window.MathJax) { MathJax.typesetPromise(); }
  });
</script>

</body>
</html>
