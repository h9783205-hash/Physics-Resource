<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lecture Notes — Physics with HPG</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16537e">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script id="MathJax-script" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-svg.js"></script>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="lecture-notes.html" class="active">Lecture Notes</a>
  <a href="ebooks.html">E-Book</a>
  <a href="previous-papers.html">Previous Year Question Papers</a>
</nav>

<div class="banner"><h1>Lecture Notes</h1></div>

<div class="content">
<div id="markdown-content">Loading notes...</div>
</div>

<script>
fetch('lecture-notes-content.md')
  .then(res => res.text())
  .then(md => {
    document.getElementById('markdown-content').innerHTML = marked.parse(md);
    if (window.MathJax) { MathJax.typesetPromise(); }
  });

function exportUnit(elementId, filename) {
  const el = document.getElementById(elementId);
  const contentHtml = el.innerHTML;

  const printWindow = window.open('', '_blank');
  printWindow.document.write(
    '<!DOCTYPE html>' +
    '<html><head><meta charset="UTF-8">' +
    '<title>' + filename + '</title>' +
    '<link rel="stylesheet" href="style.css">' +
    '<script>' +
      'window.MathJax = {' +
        'startup: {' +
          'ready: function() {' +
            'MathJax.startup.defaultReady();' +
            'MathJax.startup.promise.then(function() {' +
              'window.print();' +
            '});' +
          '}' +
        '}' +
      '};' +
    '<\/script>' +
    '<script id="MathJax-script" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-svg.js"><\/script>' +
    '</head><body>' +
    '<div class="content"><div class="unit-block" open>' + contentHtml + '</div></div>' +
    '</body></html>'
  );
  printWindow.document.close();
}

function showTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(function(panel) {
    panel.classList.remove('active');
  });
  document.querySelectorAll('.tab-btn').forEach(function(button) {
    button.classList.remove('active');
  });
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
}
</script>

</body>
</html>
