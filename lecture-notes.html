<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lecture Notes — Physics with HPG</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script id="MathJax-script" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js"></script>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="lecture-notes.html" class="active">Lecture Notes</a>
  <a href="assignments.html">Assignment</a>
  <a href="ebooks.html">E-Book</a>
  <a href="previous-papers.html">Previous Year Question Papers</a>
</nav>

<div class="banner"><h1>Lecture Notes</h1></div>

<div class="content">
<div id="markdown-content">Loading notes...</div>
</div>

<script>
fetch('lecture-notes-content.md')
  .then(res => res.text())
  .then(md => {
    document.getElementById('markdown-content').innerHTML = marked.parse(md);
    if (window.MathJax) { MathJax.typesetPromise(); }
  });

function exportUnit(elementId, filename) {
  const el = document.getElementById(elementId);
  html2pdf().from(el).set({ filename: filename, margin: 10 }).save();
}

function showTab(tabId, btn) {
  // Hide every semester/tab panel
  document.querySelectorAll('.tab-content').forEach(function(panel) {
    panel.classList.remove('active');
  });
  // Un-highlight every tab button
  document.querySelectorAll('.tab-btn').forEach(function(button) {
    button.classList.remove('active');
  });
  // Show the selected panel and highlight its button
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
}
</script>

</body>
</html>
